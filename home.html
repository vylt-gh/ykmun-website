<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YKMUN - Home</title>
    <meta name="description" content="Apply to YKMUN. Follow the countdown to the conference.">
    <link rel="icon" type="image/png" sizes="256x256" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="sky" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>

<a class="emblem" href="/home" aria-label="YKMUN Home Page">
    <img src="icon.png" alt="YKMUN Logo" width="256" height="256">
</a>

<main class="stage">

    <div class="counter">
        <img class="counter-plate" src="counter.webp" alt="Countdown to YKMUN"
             width="1556" height="2783" fetchpriority="high">

        <!-- Staff entrance, sitting exactly on a painted rivet and invisible
             until pressed. Deliberately unnamed in the page: no label, no icon,
             no hover state. See auth.js for what it opens, and note that the
             hiding is not the security — the password is. -->
        <button class="secret" id="staff-entry" type="button"
                tabindex="-1" aria-hidden="true"></button>

        <div class="windows" aria-hidden="true">
            <span class="window" data-slot="0"></span>
            <span class="window" data-slot="1"></span>
            <span class="window" data-slot="2"></span>
        </div>

        <p class="sr-only" id="countdown-text" role="status" aria-live="polite"></p>
    </div>

    <a class="cta" href="apply">Apply</a>

</main>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="stars-data.js"></script>
<script src="stars.js"></script>
<script src="countdown.js"></script>
<script src="nav.js"></script>
</body>
</html>
