<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YKMUN - Başvuru Yönetimi</title>
    <link rel="icon" type="image/png" sizes="256x256" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>

<!-- No login form. Staff sign in through the prompt in auth.js, which is
     opened from the hidden trigger on the landing page; this page shows the
     same prompt if it is reached without a session. -->

<!-- App shell (shown after login) -->
<div class="app" id="app" style="display:none">
    <header class="app-head">
        <div class="brand">
            <img src="icon.png" alt="YKMUN" width="40" height="40">
            <span class="app-title">Başvurular</span>
        </div>
        <div class="app-actions">
            <span class="user-badge" id="user-badge"></span>
            <button class="submit outline" id="signout">Çıkış yap</button>
        </div>
    </header>

    <div class="toolbar">
        <input type="search" id="search" placeholder="İsim, e-posta, telefon ara...">
        <select id="status-filter">
            <option value="">Tüm durumlar</option>
            <option value="pending">Bekleyen</option>
            <option value="accepted">Kabul edildi</option>
            <option value="rejected">Reddedildi</option>
        </select>
        <span class="count" id="count">0 başvuru</span>
    </div>

    <div class="list" id="list"></div>
    <p class="empty" id="empty" style="display:none">Eşleşen başvuru yok.</p>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
